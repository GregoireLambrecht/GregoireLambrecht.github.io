{%- assign lang = page.lang | default: "en" -%}
{%- assign t = site.data.i18n[lang] -%}
<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.title }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- if page.alt %}
  <link rel="alternate" hreflang="{% if lang == 'en' %}fr{% else %}en{% endif %}" href="{{ page.alt | relative_url }}">
  {%- endif %}
</head>
<body>
  <nav class="lang-switch">
    <a href="{{ page.alt | default: t.switch_url | relative_url }}">{{ t.switch_label }}</a>
  </nav>
  <main>
    {{ content }}
  </main>
  <footer>
    © {{ site.time | date: "%Y" }} {{ site.title }}
  </footer>
</body>
</html>
